<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060a">
<title>特技飞天跑车</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<div id="game">
  <canvas id="gl"></canvas>
  <div id="wrong-edge"></div>
  <div id="speed-lines"></div>
  <div id="flash"></div>
  <div id="hud">
    <div id="hud-top">
      <div id="hud-left"><div id="hud-speed">0</div><div class="unit">km/h</div></div>
      <div id="hud-right"><div id="hud-score">0</div><div id="hud-combo"></div><div id="hud-pending"></div></div>
    </div>
    <div id="prog"><div id="prog-fill"></div></div>
    <div id="wrong-rate">+10/s</div>
    <div id="gas-wrap">
      <div id="gas-bar"><div id="gas-fill"></div><div id="gas-cap"></div></div>
      <div id="gas-earn-track"><div id="gas-earn"></div></div>
      <div id="hud-floats"></div>
    </div>
    <div id="hud-pops"></div>
    <div id="hud-tip"></div>
    <div id="draft-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" class="bg"/><circle id="draft-arc" cx="50" cy="50" r="45"/></svg></div>
    <div id="countdown"></div>
    <div class="stick" id="stick-L"><div class="ring"></div><div class="knob"></div></div>
    <div class="stick" id="stick-R"><div class="ring"></div><div class="knob"></div></div>

    <div id="menu" class="panel show">
      <div class="title" id="t-title"></div>
      <div class="sub" id="t-sub"></div>
      <div id="howto"></div>
      <button id="btn-start" class="big"></button>
      <div class="row">
        <label><input type="checkbox" id="opt-low"> <span id="t-low"></span></label>
        <label><input type="checkbox" id="opt-sound" checked> <span id="t-sound"></span></label>
      </div>
      <div class="best" id="menu-best"></div>
    </div>

    <div id="result" class="panel">
      <div class="title" id="r-title"></div>
      <div id="r-final"></div>
      <div id="r-newbest"></div>
      <table id="r-table"></table>
      <button id="btn-again" class="big"></button>
      <div class="best" id="r-best"></div>
    </div>
  </div>
  <div id="loading"><div class="bar"><div id="load-fill"></div></div><div id="load-text">加载中</div></div>
</div>
<div id="rotate">请竖屏游玩</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
